/* V2: character stationery backgrounds and scene information inside the panel. */
body{background-color:#e9ede8;background-image:radial-gradient(ellipse at 8% 5%,color-mix(in srgb,var(--tint) 75%,transparent),transparent 60%),radial-gradient(#c6cec6 .6px,transparent .6px);background-size:auto,15px 15px;transition:background-color .25s}
.stage{margin-top:32px;padding-top:68px}
.card{background:linear-gradient(112deg,color-mix(in srgb,var(--tint) 82%,#fffdf7) 0%,#fffdf8 48%,color-mix(in srgb,var(--tint) 60%,#fffdf8) 100%);border-color:color-mix(in srgb,var(--accent) 30%,#e1e4da);box-shadow:0 20px 50px #33474410,0 3px 8px #33474404;transition:background .25s;min-height:414px}
.card:before{border-color:color-mix(in srgb,var(--accent) 16%,#fffdf8);background-image:repeating-linear-gradient(0deg,transparent,transparent 4px,#68745a03 4px,#68745a03 5px)}
.card:after{position:absolute;right:26px;top:52px;content:'✧';font:180px/1 Georgia,serif;color:var(--accent);opacity:.07;pointer-events:none;z-index:-1;transform:rotate(-12deg)}

.card[data-person="3"]:after{content:'✿';font-size:145px;text-shadow:-100px 120px 0 color-mix(in srgb,var(--accent) 45%,transparent)}
.halo{top:3px;height:350px;width:43%;left:8px;background:radial-gradient(ellipse,#fffefb 15%,var(--tint) 55%,transparent 75%)}
.info{padding-top:18px;min-height:346px;position:relative;z-index:1}
.scene{justify-content:flex-end;align-items:flex-end;flex-direction:column;gap:1px;margin:0 0 16px;padding-bottom:10px;border-bottom:1px solid color-mix(in srgb,var(--accent) 16%,transparent);font-size:10px;line-height:1.8;letter-spacing:.5px;color:#77817b}

@media(max-width:620px){.topright{display:flex;font-size:0}.theme-switch{font-size:11px;margin-left:8px;padding:6px 10px}.card[data-person="1"]:after{right:25px;width:43px;height:100px}}


/* V4: genuine alpha cutouts; remove temporary white-paper and multiply treatments. */
.portrait,.night .portrait{mix-blend-mode:normal;background:transparent;border:0;border-radius:0;box-shadow:none}
.portrait img,.night .portrait img{mix-blend-mode:normal}

/* V5: consistent bookmark icon and phone placement anchored to the information area. */
.bookmark-icon{display:inline-block!important;width:8px;height:13px;background:currentColor;clip-path:polygon(0 0,100% 0,100% 100%,50% 76%,0 100%);vertical-align:-2px}

@media(max-width:620px){
 .card[data-person="1"]:after{display:none}
 .card[data-person="1"] .info:after{display:block;right:24px;top:69px;width:27px;height:56px}
}
.mobile-preview .card[data-person="1"]:after{display:none}
.mobile-preview .card[data-person="1"] .info:after{display:block;right:24px;top:69px;width:27px;height:56px}
.card.folded .info:after{display:none!important}
